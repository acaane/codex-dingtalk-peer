name: Publish Python release

on:
  push:
    tags: ['v[0-9]*']

permissions: {}

concurrency:
  group: python-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name != 'v1.0'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release tag is on Python main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?$') {
            throw 'Expected a Python version tag of the form v1.0 or v1.0.1.'
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The release tag must point to a commit on Python main.'
          }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Stage verified Windows runtimes
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          function Get-VerifiedArchive($Url, $File, $Algorithm, $Hash) {
            curl.exe --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 180 --output $File $Url
            if ((Get-FileHash -LiteralPath $File -Algorithm $Algorithm).Hash -ine $Hash) {
              throw "Checksum mismatch for $File"
            }
          }

          $scratch = Join-Path $env:RUNNER_TEMP 'python-release-runtimes'
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $vendor = Join-Path (Get-Location) 'vendor/windows-x64'
          $spec = (Get-Content -Raw -LiteralPath 'toolchain.versions.json' | ConvertFrom-Json).python
          $pythonZip = Join-Path $scratch 'python.zip'
          $pythonDir = Join-Path $vendor $spec.directory
          Get-VerifiedArchive $spec.url $pythonZip SHA256 $spec.sha256
          Expand-Archive -LiteralPath $pythonZip -DestinationPath $pythonDir

          $dwsZip = Join-Path $scratch 'dws.zip'
          Get-VerifiedArchive 'https://github.com/DingTalk-Real-AI/dingtalk-workspace-cli/releases/download/v1.0.65/dws-windows-amd64.zip' $dwsZip SHA256 'db7cd21655ede7375676a349f44f5d9116fe28a8836276244341e109314407b7'
          $dwsDir = Join-Path $vendor 'native-dws'
          New-Item -ItemType Directory -Path $dwsDir | Out-Null
          tar.exe -xf $dwsZip -C $dwsDir dws.exe

          $codexTar = Join-Path $scratch 'codex.tgz'
          Get-VerifiedArchive 'https://registry.npmjs.org/@openai/codex/-/codex-0.157.1-win32-x64.tgz' $codexTar SHA512 'be0aacfd545737084b60cb190e061f9d1497a51879366efcd8bf2569c1ac930f3a90ec5b31aaaebd02b192e647501ac90365c6724b01eeb3141f2d57682260ac'
          $codexBin = 'package/vendor/x86_64-pc-windows-msvc/bin'
          tar.exe -xf $codexTar -C $scratch "$codexBin/codex.exe" "$codexBin/codex-code-mode-host.exe"
          $codexDir = Join-Path $vendor 'native-codex'
          New-Item -ItemType Directory -Path $codexDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $scratch $codexBin) -Destination $codexDir -Recurse

          $reviewed = @{
            'native-dws/dws.exe' = '7c42d3180e16a72fc55c1e8ba1a24dbafa506dbcb5c7e62d43633127c3ce05e3'
            'native-codex/bin/codex.exe' = '8cb0e69e99ff2a158c54815db82d0f2e524d8f301bc30184722cfd1ae5973574'
            'native-codex/bin/codex-code-mode-host.exe' = '5583872360541856fe6207eba0fb8486d9967083fbf4d40e2126ec9bb9c06ead'
          }
          foreach ($file in $reviewed.Keys) {
            if ((Get-FileHash -LiteralPath (Join-Path $vendor $file)).Hash -ine $reviewed[$file]) {
              throw "Unexpected executable: $file"
            }
          }

      - name: Test, build, and smoke-test the release packages
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The Windows runner's default TEMP can be an 8.3 alias. The tests
          # compare canonical paths when checking filesystem boundaries.
          $temp = Join-Path $env:RUNNER_TEMP 'python-release-tests'
          New-Item -ItemType Directory -Path $temp | Out-Null
          $env:TEMP = $temp
          $env:TMP = $temp
          python -B -W error::ResourceWarning -m unittest -v
          python -B build_package.py
          python -B build_package.py --patch-only
          python -B build_package.py --bus-recovery-only
          python -B build_package.py --event-diagnostics-only

          @'
          from pathlib import Path
          from zipfile import ZipFile

          for path in sorted(Path("dist").glob("*.zip")):
              with ZipFile(path) as archive:
                  bad_entry = archive.testzip()
                  if bad_entry is not None:
                      raise SystemExit(f"{path}: CRC check failed for {bad_entry}")
          '@ | python -B -
          $smoke = Join-Path $env:RUNNER_TEMP '中文 验证'
          Expand-Archive -LiteralPath 'dist/codex-dingtalk-peer-windows-full.zip' -DestinationPath $smoke
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $smoke 'install.ps1') -ToolsOnly -PortableOnly
          if ((Test-Path -LiteralPath (Join-Path $smoke '.tools/npm')) -or
              (Test-Path -LiteralPath (Join-Path $smoke '.local'))) {
            throw 'The portable check downloaded dependencies or created deployment configuration.'
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-windows-release
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-windows-release
          path: dist

      - name: Publish the version and verified assets
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archives=(
            codex-dingtalk-peer.zip
            codex-dingtalk-peer-windows-full.zip
            connector-recovery-update.zip
            event-bus-recovery.zip
            event-diagnostics.zip
          )
          declare -A expected
          for archive in "${archives[@]}"; do
            sed 's/\r$//' "$archive.sha256" | sha256sum --check --strict
            for file in "$archive" "$archive.sha256"; do
              digest=$(sha256sum "$file")
              expected[$file]="sha256:${digest%% *}"
            done
          done

          releases="repos/$GITHUB_REPOSITORY/releases"
          find_release() {
            gh api --paginate "$releases?per_page=100" \
              | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id'
          }
          release_id=$(find_release)
          if [[ -z "$release_id" ]]; then
            ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            gh api "$ref" --jq '.ref' >/dev/null
            release_id=$(gh api --method POST "$releases" \
              --raw-field "tag_name=$RELEASE_TAG" --raw-field "name=Python $RELEASE_TAG" \
              --raw-field 'body=Python connector for Windows. Checksums accompany each archive.' \
              --field draft=true --jq '.id')
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Could not uniquely identify the release for $RELEASE_TAG." >&2
            exit 1
          fi
          endpoint="$releases/$release_id"
          release=$(gh api "$endpoint")
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and (.prerelease | not)' <<< "$release" >/dev/null

          verify_asset() {
            jq -e --arg name "$1" --arg digest "${expected[$1]}" \
              '[.assets[] | select(.name == $name and .digest == $digest and .state == "uploaded")] | length == 1' \
              <<< "$release" >/dev/null
          }
          missing=()
          for archive in "${archives[@]}"; do
            for file in "$archive" "$archive.sha256"; do
              if jq -e --arg name "$file" '.assets | any(.name == $name)' <<< "$release" >/dev/null; then
                verify_asset "$file" || { echo "Existing release asset differs: $file" >&2; exit 1; }
              else
                missing+=("$file")
              fi
            done
          done
          if (( ${#missing[@]} )); then
            jq -e '.draft' <<< "$release" >/dev/null
            gh release upload "$RELEASE_TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            release=$(gh api "$endpoint")
          fi
          for file in "${!expected[@]}"; do
            verify_asset "$file"
          done
          if jq -e '.draft' <<< "$release" >/dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi
          gh api "$endpoint" | jq -er 'select(.draft == false) | .html_url'
