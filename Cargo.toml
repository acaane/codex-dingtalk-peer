[package]
name = "ai-integration-desk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
futures-lite = "2"
getrandom = "0.3"
gpui-kit = "=0.10.0"
if-addrs = "0.15"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite"] }
subtle = "2.6"

[dev-dependencies]
tempfile = "3"
